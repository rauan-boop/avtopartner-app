services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r-partner-web
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - auth-service

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.waha
    container_name: r-line-auth-service
    environment:
      PORT: 3001
      SUPABASE_URL: ${SUPABASE_URL:-https://api.ronat.asia}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    restart: unless-stopped
