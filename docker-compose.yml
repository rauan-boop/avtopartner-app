services:
  waha:
    image: devlikeapro/waha:latest
    container_name: r-line-waha
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r-partner-web
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - auth-service
      - waha

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.waha
    container_name: r-line-auth-service
    environment:
      PORT: 3001
      SUPABASE_URL: ${SUPABASE_URL:-https://api.ronat.asia}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      WAHA_URL: ${WAHA_URL:-http://waha:3000}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
    restart: unless-stopped
    depends_on:
      - waha
