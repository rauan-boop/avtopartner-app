server {
    listen 80;
    listen [::]:80;
    server_name partner.ronat.asia;

    root /usr/share/nginx/html;
    index avtopartner-app-mockup.html;

    location / {
        try_files $uri $uri/ /avtopartner-app-mockup.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
